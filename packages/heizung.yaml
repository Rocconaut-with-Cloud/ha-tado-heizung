        data: { value: "noch nichts gelernt" }

automation:
  - id: heizung_steuerung_zentral
    alias: Heizung Steuerung (zentral)
    description: >
      Stellt alle tado-Thermostate auf den Wert der Sensoren
      "Heizung Soll …" (Anwesenheit, gelernte Zeiten, Fenster, Urlaub).
    mode: queued
    max: 15
    triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: state
        entity_id:
          - sensor.heizung_soll_wohnkueche
          - sensor.heizung_soll_bad
          - sensor.heizung_soll_schlafzimmer
          - sensor.heizung_soll_zimmer1
          - sensor.heizung_soll_zimmer2
          - sensor.heizung_soll_zimmer3
          - input_boolean.heizung_automatik
        to: ~
      - trigger: state
        id: waechter
        entity_id:
          - climate.thermostat_wohnzimmer
          - climate.thermostat_kueche
          - climate.thermostat_bad
          - climate.thermostat_schlafzimmer
          - climate.thermostat_zimmer_1
          - climate.thermostat_zimmer_2
          - climate.thermostat_zimmer_3
        to: "off"
        for: "00:01:00"
      - trigger: state
        id: verfuegbar
        entity_id:
          - climate.thermostat_wohnzimmer
          - climate.thermostat_kueche
          - climate.thermostat_bad
          - climate.thermostat_schlafzimmer
          - climate.thermostat_zimmer_1
          - climate.thermostat_zimmer_2
          - climate.thermostat_zimmer_3
        from: unavailable
        for: "00:00:30"
    conditions:
      - condition: state
        entity_id: input_boolean.heizung_automatik
        state: "on"
    actions:
      - if: "{{ trigger.id == 'start' }}"
        then:
          - delay: "00:01:00"
        else:
          - delay: "00:00:02"
      - variables:
          ziele: >
            {% set ns = namespace(out=[]) %}
            {% for r in [
              {'k': 'wohnkueche', 't': ['climate.thermostat_wohnzimmer', 'climate.thermostat_kueche']},
              {'k': 'bad', 't': ['climate.thermostat_bad']},
              {'k': 'schlafzimmer', 't': ['climate.thermostat_schlafzimmer']},
              {'k': 'zimmer1', 't': ['climate.thermostat_zimmer_1']},
              {'k': 'zimmer2', 't': ['climate.thermostat_zimmer_2']},
              {'k': 'zimmer3', 't': ['climate.thermostat_zimmer_3']}
            ] %}
              {% set s = states('sensor.heizung_soll_' ~ r.k) %}
              {% if s == 'aus' or is_number(s) %}
                {% for e in r.t %}
                  {% set ns.out = ns.out + [{'e': e, 'z': 'off' if s == 'aus' else (s | float)}] %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ ziele }}"
          sequence:
            - if: "{{ states(repeat.item.e) not in ['unavailable', 'unknown'] }}"
              then:
                - choose:
                    # Fenster offen -> aus
                    - conditions: "{{ repeat.item.z == 'off' }}"
                      sequence:
                        - if: "{{ not is_state(repeat.item.e, 'off') }}"
                          then:
                            - action: climate.set_hvac_mode
                              target:
                                entity_id: "{{ repeat.item.e }}"
                              data:
                                hvac_mode: "off"
                    # war aus -> ZWEI Schritte: erst Heizen, dann Temperatur
                    - conditions: "{{ is_state(repeat.item.e, 'off') }}"
                      sequence:
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: "{{ repeat.item.e }}"
                          data:
                            hvac_mode: heat
                        - delay: "00:00:05"
                        - action: climate.set_temperature
                          target:
                            entity_id: "{{ repeat.item.e }}"
                          data:
                            temperature: "{{ repeat.item.z | float }}"
                    # heizt bereits -> nur Temperatur
                    - conditions: "{{ (state_attr(repeat.item.e, 'temperature') | float(0)) != (repeat.item.z | float) }}"
                      sequence:
                        - action: climate.set_temperature
                          target:
                            entity_id: "{{ repeat.item.e }}"
                          data:
                            temperature: "{{ repeat.item.z | float }}"

  - id: heizung_absicherung
    alias: Heizung Absicherung (Abweichung korrigieren)
    description: >
      Stellt nur die Räume zurück, deren Thermostat länger als 2 Minuten von
      "Soll laut Automation" abweicht (z. B. tado-Timer, Rückkehr nach Offline).
      Hält die Abweichung an, wird alle 15 Minuten erneut versucht.
    mode: queued
    max: 10
    triggers:
      - trigger: state
        id: ab_wohnkueche
        entity_id: binary_sensor.heizung_abweichung_wohnkueche
        to: "on"
      - trigger: state
        id: ab_bad
        entity_id: binary_sensor.heizung_abweichung_bad
        to: "on"
      - trigger: state
        id: ab_schlafzimmer
        entity_id: binary_sensor.heizung_abweichung_schlafzimmer
        to: "on"
      - trigger: state
        id: ab_zimmer1
        entity_id: binary_sensor.heizung_abweichung_zimmer1
        to: "on"
      - trigger: state
        id: ab_zimmer2
        entity_id: binary_sensor.heizung_abweichung_zimmer2
        to: "on"
      - trigger: state
        id: ab_zimmer3
        entity_id: binary_sensor.heizung_abweichung_zimmer3
        to: "on"
      - trigger: time_pattern
        id: wiederholung
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.heizung_automatik
        state: "on"
    actions:
      - variables:
          raeume: >
            {% if trigger.id.startswith('ab_') %}
              {{ [trigger.id[3:]] }}
            {% else %}
              {% set ns = namespace(r=[]) %}{% for k in ['wohnkueche', 'bad', 'schlafzimmer', 'zimmer1', 'zimmer2', 'zimmer3'] %}{% if is_state('binary_sensor.heizung_abweichung_' ~ k, 'on') %}{% set ns.r = ns.r + [k] %}{% endif %}{% endfor %}{{ ns.r }}
            {% endif %}
      - condition: template
        value_template: "{{ raeume | count > 0 }}"
      - variables:
          ziele: >
            {% set ns = namespace(out=[]) %}
            {% for r in [
              {'k': 'wohnkueche', 't': ['climate.thermostat_wohnzimmer', 'climate.thermostat_kueche']},
              {'k': 'bad', 't': ['climate.thermostat_bad']},
              {'k': 'schlafzimmer', 't': ['climate.thermostat_schlafzimmer']},
              {'k': 'zimmer1', 't': ['climate.thermostat_zimmer_1']},
              {'k': 'zimmer2', 't': ['climate.thermostat_zimmer_2']},
              {'k': 'zimmer3', 't': ['climate.thermostat_zimmer_3']}
            ] %}
              {% set s = states('sensor.heizung_soll_' ~ r.k) if r.k in raeume else 'x' %}
              {% if s == 'aus' or is_number(s) %}
                {% for e in r.t %}
                  {% set ns.out = ns.out + [{'e': e, 'z': 'off' if s == 'aus' else (s | float)}] %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ ziele }}"
          sequence:
            - if: "{{ states(repeat.item.e) not in ['unavailable', 'unknown'] }}"
              then:
                - choose:
                    # Fenster offen -> aus
                    - conditions: "{{ repeat.item.z == 'off' }}"
                      sequence:
                        - if: "{{ not is_state(repeat.item.e, 'off') }}"
                          then:
                            - action: climate.set_hvac_mode
                              target:
                                entity_id: "{{ repeat.item.e }}"
                              data:
                                hvac_mode: "off"
                    # war aus -> ZWEI Schritte: erst Heizen, dann Temperatur
                    - conditions: "{{ is_state(repeat.item.e, 'off') }}"
                      sequence:
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: "{{ repeat.item.e }}"
                          data:
                            hvac_mode: heat
                        - delay: "00:00:05"
                        - action: climate.set_temperature
                          target:
                            entity_id: "{{ repeat.item.e }}"
                          data:
                            temperature: "{{ repeat.item.z | float }}"
                    # heizt bereits -> nur Temperatur
                    - conditions: "{{ (state_attr(repeat.item.e, 'temperature') | float(0)) != (repeat.item.z | float) }}"
                      sequence:
                        - action: climate.set_temperature
                          target:
                            entity_id: "{{ repeat.item.e }}"
                          data:
                            temperature: "{{ repeat.item.z | float }}"

  - id: heizung_lernen
    alias: Heizung Lernen (Vorlauf/Nachlauf)
    description: >
      Misst, ob die Räume zur Zielzeit warm waren bzw. wie stark sie bis zur
      Absenkzeit abgekühlt sind, und passt Vorlauf/Nachlauf an.
    mode: queued
    max: 30
    triggers:
      - trigger: state
        id: erreicht_wohnkueche
        entity_id: sensor.heizung_ist_wohnkueche
      - trigger: time
        id: erreicht_wohnkueche
        at: sensor.heizung_heizstart_wohnkueche
      - trigger: time
        id: ziel_wohnkueche
        at: sensor.heizung_ziel_wohnkueche
      - trigger: time
        id: spaet_wohnkueche
        at:
          entity_id: sensor.heizung_ziel_wohnkueche
          offset: "01:00:00"
      - trigger: time
        id: aus_wohnkueche
        at: sensor.heizung_absenkstart_wohnkueche
      - trigger: state
        id: erreicht_bad
        entity_id: sensor.heizung_ist_bad
      - trigger: time
        id: erreicht_bad
        at: sensor.heizung_heizstart_bad
      - trigger: time
        id: ziel_bad
        at: sensor.heizung_ziel_bad
      - trigger: time
        id: spaet_bad
        at:
          entity_id: sensor.heizung_ziel_bad
          offset: "01:00:00"
      - trigger: time
        id: aus_bad
        at: sensor.heizung_absenkstart_bad
      - trigger: state
        id: erreicht_schlafzimmer
        entity_id: sensor.heizung_ist_schlafzimmer
      - trigger: time
        id: erreicht_schlafzimmer
        at: sensor.heizung_heizstart_schlafzimmer
      - trigger: time
        id: ziel_schlafzimmer
        at: sensor.heizung_ziel_schlafzimmer
      - trigger: time
        id: spaet_schlafzimmer
        at:
          entity_id: sensor.heizung_ziel_schlafzimmer
          offset: "01:00:00"
      - trigger: time
        id: aus_schlafzimmer
        at: sensor.heizung_absenkstart_schlafzimmer
      - trigger: state
        id: erreicht_zimmer1
        entity_id: sensor.heizung_ist_zimmer1
      - trigger: time
        id: erreicht_zimmer1
        at: sensor.heizung_heizstart_zimmer1
      - trigger: time
        id: ziel_zimmer1
        at: sensor.heizung_ziel_zimmer1
      - trigger: time
        id: spaet_zimmer1
        at:
          entity_id: sensor.heizung_ziel_zimmer1
          offset: "01:00:00"
      - trigger: time
        id: aus_zimmer1
        at: sensor.heizung_absenkstart_zimmer1
      - trigger: state
        id: erreicht_zimmer2
        entity_id: sensor.heizung_ist_zimmer2
      - trigger: time
        id: erreicht_zimmer2
        at: sensor.heizung_heizstart_zimmer2
      - trigger: time
        id: ziel_zimmer2
        at: sensor.heizung_ziel_zimmer2
      - trigger: time
        id: spaet_zimmer2
        at:
          entity_id: sensor.heizung_ziel_zimmer2
          offset: "01:00:00"
      - trigger: time
        id: aus_zimmer2
        at: sensor.heizung_absenkstart_zimmer2
      - trigger: state
        id: erreicht_zimmer3
        entity_id: sensor.heizung_ist_zimmer3
      - trigger: time
        id: erreicht_zimmer3
        at: sensor.heizung_heizstart_zimmer3
      - trigger: time
        id: ziel_zimmer3
        at: sensor.heizung_ziel_zimmer3
      - trigger: time
        id: spaet_zimmer3
        at:
          entity_id: sensor.heizung_ziel_zimmer3
          offset: "01:00:00"
      - trigger: time
        id: aus_zimmer3
        at: sensor.heizung_absenkstart_zimmer3
      - trigger: time
        id: abend_alle
        at: sensor.heizung_zeit_absenkung
    conditions:
      - condition: state
        entity_id:
          - input_boolean.heizung_automatik
          - input_boolean.heizung_lernen
        state: "on"
      - condition: state
        entity_id: input_boolean.heizung_urlaub
        state: "off"
    actions:
      - variables:
          art: "{{ trigger.id.split('_')[0] }}"
          k: "{{ trigger.id.split('_')[1] }}"
          namen: "{{ {'wohnkueche': 'Wohnküche', 'bad': 'Bad', 'schlafzimmer': 'Schlafzimmer', 'zimmer1': 'Zimmer 1', 'zimmer2': 'Zimmer 2', 'zimmer3': 'Zimmer 3'} }}"
          person: >
            {% set zimmer3_p = states('input_text.heizung_person_zimmer3') %}
            {% set zimmer3_p = zimmer3_p if zimmer3_p.startswith('person.') else 'person.bewohner_1' %}
            {{ ({'wohnkueche': 'person.bewohner_1', 'bad': 'person.bewohner_1', 'schlafzimmer': 'person.bewohner_1', 'zimmer1': 'person.bewohner_2', 'zimmer2': 'person.bewohner_3', 'zimmer3': zimmer3_p}).get(k, 'person.bewohner_1') }}
          jetzt_ts: "{{ as_timestamp(now()) }}"
          start_ts: "{{ as_timestamp(states('sensor.heizung_heizstart_' ~ k), 0) }}"
          ziel_ts: "{{ as_timestamp(states('sensor.heizung_ziel_' ~ k), 0) }}"
          erreicht_ts: "{{ as_timestamp(states('input_datetime.heizung_erreicht_' ~ k), 0) }}"
          ist: "{{ states('sensor.heizung_ist_' ~ k) | float(-99) }}"
          soll: "{{ states('input_number.heizung_temp_' ~ k) | float(20) }}"
          tol_warm: "{{ states('input_number.heizung_toleranz_warm') | float(0.3) }}"
          vorlauf: "{{ states('input_number.heizung_vorlauf_' ~ k) | int(15) }}"
          fenster_ok: >
            {% set s = expand('binary_sensor.heizung_fenster_' ~ k) %}
            {{ s | count == 1 and s[0].state == 'off' and as_timestamp(s[0].last_changed) < start_ts }}
          zeit: "{{ now().strftime('%d.%m. %H:%M') }}"
      - choose:
          # ---- warm erreicht erfassen (ggf. Verspätung auswerten) ----
          - conditions:
              - "{{ art == 'erreicht' }}"
              - "{{ start_ts > 0 and start_ts <= jetzt_ts <= ziel_ts + 3600 }}"
              - "{{ erreicht_ts < start_ts }}"
              - "{{ ist >= soll - tol_warm }}"
              - "{{ is_state(person, 'home') }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "input_datetime.heizung_erreicht_{{ k }}"
                data:
                  timestamp: "{{ jetzt_ts }}"
              - if: "{{ jetzt_ts > ziel_ts and fenster_ok and jetzt_ts - start_ts > 60 }}"
                then:
                  - variables:
                      spaet_min: "{{ ((jetzt_ts - ziel_ts) / 60) | round(0) | int }}"
                      neu: "{{ [45, vorlauf + ((spaet_min / 2) | round(0, 'ceil') | int)] | min }}"
                  - action: input_number.set_value
                    target:
                      entity_id: "input_number.heizung_vorlauf_{{ k }}"
                    data:
                      value: "{{ neu }}"
                  - action: input_text.set_value
                    target:
                      entity_id: "input_text.heizung_ergebnis_morgen_{{ k }}"
                    data:
                      value: "{{ zeit }}: {{ spaet_min }} Min zu spät warm → Vorlauf {{ vorlauf }} → {{ neu }} Min"
                  - if: "{{ spaet_min > 5 and is_state('input_boolean.heizung_benachrichtigung', 'on') }}"
                    then:
                      - action: notify.mobile_app_mein_handy
                        data:
                          title: "Heizung {{ namen[k] }}"
                          message: "Erst {{ spaet_min }} Min nach der Zielzeit warm. Vorlauf jetzt {{ neu }} Min."
          # ---- Zielzeit: war es schon warm? ----
          - conditions:
              - "{{ art == 'ziel' }}"
              - "{{ erreicht_ts >= start_ts > 0 }}"
              - "{{ is_state(person, 'home') }}"
            sequence:
              - choose:
                  - conditions: "{{ erreicht_ts - start_ts <= 60 }}"
                    sequence:
                      - action: input_text.set_value
                        target:
                          entity_id: "input_text.heizung_ergebnis_morgen_{{ k }}"
                        data:
                          value: "{{ zeit }}: war schon warm – nicht gelernt"
                  - conditions: "{{ not fenster_ok }}"
                    sequence:
                      - action: input_text.set_value
                        target:
                          entity_id: "input_text.heizung_ergebnis_morgen_{{ k }}"
                        data:
                          value: "{{ zeit }}: Fenster war offen – nicht gelernt"
                default:
                  - variables:
                      frueh_min: "{{ ((ziel_ts - erreicht_ts) / 60) | round(0) | int }}"
                      neu: "{{ [0, vorlauf - ((frueh_min / 2) | round(0, 'floor') | int)] | max if frueh_min >= 2 else vorlauf }}"
                  - action: input_number.set_value
                    target:
                      entity_id: "input_number.heizung_vorlauf_{{ k }}"
                    data:
                      value: "{{ neu }}"
                  - action: input_text.set_value
                    target:
                      entity_id: "input_text.heizung_ergebnis_morgen_{{ k }}"
                    data:
                      value: >
                        {{ zeit }}: {{ 'pünktlich warm' if frueh_min < 2 else frueh_min ~ ' Min zu früh warm' }}
                        → Vorlauf {{ vorlauf }} → {{ neu }} Min
          # ---- 60 Min nach Zielzeit immer noch nicht warm ----
          - conditions:
              - "{{ art == 'spaet' }}"
              - "{{ erreicht_ts < start_ts }}"
              - "{{ is_state(person, 'home') }}"
              - "{{ fenster_ok }}"
            sequence:
              - variables:
                  neu: "{{ [45, vorlauf + 10] | min }}"
              - action: input_number.set_value
                target:
                  entity_id: "input_number.heizung_vorlauf_{{ k }}"
                data:
                  value: "{{ neu }}"
              - action: input_text.set_value
                target:
                  entity_id: "input_text.heizung_ergebnis_morgen_{{ k }}"
                data:
                  value: "{{ zeit }}: nicht warm geworden ({{ ist }} °C) → Vorlauf {{ vorlauf }} → {{ neu }} Min"
              - if: "{{ is_state('input_boolean.heizung_benachrichtigung', 'on') }}"
                then:
                  - action: notify.mobile_app_mein_handy
                    data:
                      title: "Heizung {{ namen[k] }}"
                      message: "Seit 1 Std. über der Zielzeit nicht warm ({{ ist }} °C statt {{ soll }} °C). Vorlauf jetzt {{ neu }} Min."
          # ---- früh absenken: Ist-Temperatur merken ----
          - conditions:
              - "{{ art == 'aus' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: "input_number.heizung_ist_aus_{{ k }}"
                data:
                  value: >
                    {{ ist if (is_state(person, 'home')
                               and is_state('binary_sensor.heizung_fenster_' ~ k, 'off')
                               and ist > -50) else -99 }}
          # ---- Absenkzeit: Abkühlung auswerten (alle Räume) ----
          - conditions:
              - "{{ art == 'abend' }}"
            sequence:
              - delay: "00:00:05"
              - repeat:
                  for_each: ['wohnkueche', 'bad', 'schlafzimmer', 'zimmer1', 'zimmer2', 'zimmer3']
                  sequence:
                    - variables:
                        rk: "{{ repeat.item }}"
                        rp: >
                          {% set zimmer3_p = states('input_text.heizung_person_zimmer3') %}
                          {% set zimmer3_p = zimmer3_p if zimmer3_p.startswith('person.') else 'person.bewohner_1' %}
                          {{ ({'wohnkueche': 'person.bewohner_1', 'bad': 'person.bewohner_1', 'schlafzimmer': 'person.bewohner_1', 'zimmer1': 'person.bewohner_2', 'zimmer2': 'person.bewohner_3', 'zimmer3': zimmer3_p}).get(rk, 'person.bewohner_1') }}
                        nl: "{{ states('input_number.heizung_nachlauf_' ~ rk) | int(10) }}"
                        ist_aus: "{{ states('input_number.heizung_ist_aus_' ~ rk) | float(-99) }}"
                        ist_jetzt: "{{ states('sensor.heizung_ist_' ~ rk) | float(-99) }}"
                        tol_ab: "{{ states('input_number.heizung_toleranz_abfall') | float(0.5) }}"
                        aus_ts: "{{ as_timestamp(states('sensor.heizung_absenkstart_' ~ rk), 0) }}"
                        f_ok: >
                          {% set s = expand('binary_sensor.heizung_fenster_' ~ rk) %}
                          {{ s | count == 1 and s[0].state == 'off' and as_timestamp(s[0].last_changed) < aus_ts }}
                        zeit2: "{{ now().strftime('%d.%m. %H:%M') }}"
                    - choose:
                        - conditions: "{{ nl == 0 }}"
                          sequence:
                            - action: input_number.set_value
                              target:
                                entity_id: "input_number.heizung_nachlauf_{{ rk }}"
                              data:
                                value: 5
                            - action: input_text.set_value
                              target:
                                entity_id: "input_text.heizung_ergebnis_abend_{{ rk }}"
                              data:
                                value: "{{ zeit2 }}: Nachlauf war 0 → 5 Min zum Testen"
                        - conditions: "{{ ist_aus > -50 and ist_jetzt > -50 and f_ok and is_state(rp, 'home') }}"
                          sequence:
                            - variables:
                                abfall: "{{ (ist_aus - ist_jetzt) | round(2) }}"
                                erlaubt: "{{ (tol_ab / (abfall / nl)) if abfall > 0.05 else 999 }}"
                                neu: >
                                  {% if abfall <= 0.05 %}{{ [60, nl + 5] | min }}
                                  {% else %}{{ [0, [60, (nl + (erlaubt - nl) / 2) | round(0) | int] | min] | max }}{% endif %}
                            - action: input_number.set_value
                              target:
                                entity_id: "input_number.heizung_nachlauf_{{ rk }}"
                              data:
                                value: "{{ neu }}"
                            - action: input_text.set_value
                              target:
                                entity_id: "input_text.heizung_ergebnis_abend_{{ rk }}"
                              data:
                                value: "{{ zeit2 }}: in {{ nl }} Min um {{ abfall }} °C abgekühlt → Nachlauf {{ nl }} → {{ neu | int }} Min"
                      default:
                        - action: input_text.set_value
                          target:
                            entity_id: "input_text.heizung_ergebnis_abend_{{ rk }}"
                          data:
                            value: "{{ zeit2 }}: nicht gelernt (abwesend, Fenster oder keine Messung)"
                    - action: input_number.set_value
                      target:
                        entity_id: "input_number.heizung_ist_aus_{{ rk }}"
                      data:
                        value: -99
