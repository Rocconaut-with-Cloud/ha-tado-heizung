template:
  - binary_sensor:
      - name: Heizung Fenster Wohnkueche
        unique_id: heizung_fenster_wohnkueche
        device_class: window
        state: >
          {% set kalt = states('sensor.aussentemperatur') | float(0)
             < states('input_number.heizung_fenster_aussen_grenze') | float(20) %}
          {{ kalt and (is_state('binary_sensor.fenster_wohnzimmer', 'on')
                    or is_state('binary_sensor.fenster_kueche_1', 'on')
                    or is_state('binary_sensor.fenster_kueche_2', 'on')) }}
        delay_on: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_offen_min') | int(2)) }}"
        delay_off: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_zu_min') | int(2)) }}"
      - name: Heizung Fenster Bad
        unique_id: heizung_fenster_bad
        device_class: window
        state: >
          {% set kalt = states('sensor.aussentemperatur') | float(0)
             < states('input_number.heizung_fenster_aussen_grenze') | float(20) %}
          {{ kalt and (is_state('binary_sensor.fenster_bad', 'on')) }}
        delay_on: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_offen_min') | int(2)) }}"
        delay_off: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_zu_min') | int(2)) }}"
      - name: Heizung Fenster Schlafzimmer
        unique_id: heizung_fenster_schlafzimmer
        device_class: window
        state: >
          {% set kalt = states('sensor.aussentemperatur') | float(0)
             < states('input_number.heizung_fenster_aussen_grenze') | float(20) %}
          {{ kalt and (is_state('binary_sensor.fenster_schlafzimmer', 'on')) }}
        delay_on: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_offen_min') | int(2)) }}"
        delay_off: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_zu_min') | int(2)) }}"
      - name: Heizung Fenster Zimmer1
        unique_id: heizung_fenster_zimmer1
        device_class: window
        state: >
          {% set kalt = states('sensor.aussentemperatur') | float(0)
             < states('input_number.heizung_fenster_aussen_grenze') | float(20) %}
          {{ kalt and (is_state('binary_sensor.fenster_zimmer_1', 'on')) }}
        delay_on: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_offen_min') | int(2)) }}"
        delay_off: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_zu_min') | int(2)) }}"
      - name: Heizung Fenster Zimmer2
        unique_id: heizung_fenster_zimmer2
        device_class: window
        state: >
          {% set kalt = states('sensor.aussentemperatur') | float(0)
             < states('input_number.heizung_fenster_aussen_grenze') | float(20) %}
          {{ kalt and (is_state('binary_sensor.fenster_zimmer_2', 'on')) }}
        delay_on: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_offen_min') | int(2)) }}"
        delay_off: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_zu_min') | int(2)) }}"
      - name: Heizung Fenster Zimmer3
        unique_id: heizung_fenster_zimmer3
        device_class: window
        state: >
          {% set kalt = states('sensor.aussentemperatur') | float(0)
             < states('input_number.heizung_fenster_aussen_grenze') | float(20) %}
          {{ kalt and (is_state('binary_sensor.fenster_zimmer_3', 'on')) }}
        delay_on: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_offen_min') | int(2)) }}"
        delay_off: "{{ '00:%02d:00' % (states('input_number.heizung_fenster_zu_min') | int(2)) }}"
  - sensor:
      - name: Heizung Zeit warm frueh
        unique_id: heizung_zeit_warm_frueh
        device_class: timestamp
        state: >
          {% set heute = is_state('binary_sensor.arbeitstag_heute', 'on') if states('binary_sensor.arbeitstag_heute') in ['on', 'off'] else now().isoweekday() <= 5 %}
          {{ today_at(states('input_datetime.heizung_wt_morgen_start') if heute
               else states('input_datetime.heizung_we_nacht_ende')).isoformat() }}
      - name: Heizung Zeit warm spaet
        unique_id: heizung_zeit_warm_spaet
        device_class: timestamp
        state: >
          {% set heute = is_state('binary_sensor.arbeitstag_heute', 'on') if states('binary_sensor.arbeitstag_heute') in ['on', 'off'] else now().isoweekday() <= 5 %}
          {{ today_at(states('input_datetime.heizung_wt_zimmer_start') if heute
               else states('input_datetime.heizung_we_nacht_ende')).isoformat() }}
      - name: Heizung Zeit Absenkung
        unique_id: heizung_zeit_absenkung
        device_class: timestamp
        state: >
          {% set morgen = is_state('binary_sensor.arbeitstag_morgen', 'on') if states('binary_sensor.arbeitstag_morgen') in ['on', 'off'] else (now() + timedelta(days=1)).isoweekday() <= 5 %}
          {{ today_at(states('input_datetime.heizung_wt_nacht_start') if morgen
               else states('input_datetime.heizung_we_nacht_start')).isoformat() }}
      - name: Heizung Ist Wohnkueche
        unique_id: heizung_ist_wohnkueche
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: "{{ states('sensor.temperatur_wohnzimmer') | float(0) }}"
        availability: "{{ is_number(states('sensor.temperatur_wohnzimmer')) }}"
      - name: Heizung Ziel Wohnkueche
        unique_id: heizung_ziel_wohnkueche
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_warm_frueh')) %}
          {{ (z - timedelta(minutes=0)).isoformat() if z else none }}
      - name: Heizung Heizstart Wohnkueche
        unique_id: heizung_heizstart_wohnkueche
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_warm_frueh')) %}
          {{ (z - timedelta(minutes=0
                 + states('input_number.heizung_vorlauf_wohnkueche') | int(15))).isoformat() if z else none }}
      - name: Heizung Absenkstart Wohnkueche
        unique_id: heizung_absenkstart_wohnkueche
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_absenkung')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_nachlauf_wohnkueche') | int(10))).isoformat() if z else none }}
      - name: Heizung Ist Bad
        unique_id: heizung_ist_bad
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: "{{ state_attr('climate.thermostat_bad', 'current_temperature') | float(0) }}"
        availability: "{{ is_number(state_attr('climate.thermostat_bad', 'current_temperature')) }}"
      - name: Heizung Ziel Bad
        unique_id: heizung_ziel_bad
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_warm_frueh')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_puffer_tado') | int(5))).isoformat() if z else none }}
      - name: Heizung Heizstart Bad
        unique_id: heizung_heizstart_bad
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_warm_frueh')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_puffer_tado') | int(5)
                 + states('input_number.heizung_vorlauf_bad') | int(15))).isoformat() if z else none }}
      - name: Heizung Absenkstart Bad
        unique_id: heizung_absenkstart_bad
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_absenkung')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_nachlauf_bad') | int(10))).isoformat() if z else none }}
      - name: Heizung Ist Schlafzimmer
        unique_id: heizung_ist_schlafzimmer
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: "{{ state_attr('climate.thermostat_schlafzimmer', 'current_temperature') | float(0) }}"
        availability: "{{ is_number(state_attr('climate.thermostat_schlafzimmer', 'current_temperature')) }}"
      - name: Heizung Ziel Schlafzimmer
        unique_id: heizung_ziel_schlafzimmer
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_warm_spaet')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_puffer_tado') | int(5))).isoformat() if z else none }}
      - name: Heizung Heizstart Schlafzimmer
        unique_id: heizung_heizstart_schlafzimmer
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_warm_spaet')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_puffer_tado') | int(5)
                 + states('input_number.heizung_vorlauf_schlafzimmer') | int(15))).isoformat() if z else none }}
      - name: Heizung Absenkstart Schlafzimmer
        unique_id: heizung_absenkstart_schlafzimmer
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_absenkung')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_nachlauf_schlafzimmer') | int(10))).isoformat() if z else none }}
      - name: Heizung Ist Zimmer1
        unique_id: heizung_ist_zimmer1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: "{{ state_attr('climate.thermostat_zimmer_1', 'current_temperature') | float(0) }}"
        availability: "{{ is_number(state_attr('climate.thermostat_zimmer_1', 'current_temperature')) }}"
      - name: Heizung Ziel Zimmer1
        unique_id: heizung_ziel_zimmer1
        device_class: timestamp
        state: >
          {% set z = as_datetime(states('sensor.heizung_zeit_warm_spaet')) %}
          {{ (z - timedelta(minutes=states('input_number.heizung_puffer_tado') | int(5))).isoformat() if z else none }}
      - name: Heizung Heizstart Zimmer1
        unique_id: heizung_heizstart_zimmer1
        device_class: timestamp
