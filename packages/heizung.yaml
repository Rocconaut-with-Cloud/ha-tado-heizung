################################################################
#  Heizungssteuerung für Home Assistant mit Lernfunktion
#  Heating control for Home Assistant with adaptive pre-heating
#
#  Datei / file: /config/packages/heizung.yaml
#  Doku / docs:  README.md (EN), README.de.md (DE)
#
#  ANPASSEN / ADAPT – diese Entitäten durch deine ersetzen
#  (Suchen & Ersetzen) / replace these entities with yours:
#
#   Personen / persons
#     person.bewohner_1   Wohnküche, Bad, Schlafzimmer (+ Zimmer 3)
#     person.bewohner_2   Zimmer 1
#     person.bewohner_3   Zimmer 2
#   Thermostate / thermostats
#     climate.thermostat_wohnzimmer   climate.thermostat_kueche
#     climate.thermostat_bad          climate.thermostat_schlafzimmer
#     climate.thermostat_zimmer_1     climate.thermostat_zimmer_2
#     climate.thermostat_zimmer_3
#   Fensterkontakte / window contacts
#     binary_sensor.fenster_wohnzimmer  binary_sensor.fenster_kueche_1
#     binary_sensor.fenster_kueche_2    binary_sensor.fenster_bad
#     binary_sensor.fenster_schlafzimmer
#     binary_sensor.fenster_zimmer_1 / _2 / _3
#   Temperatur / temperature
#     sensor.temperatur_wohnzimmer   Raumsensor Wohnküche / room sensor
#     sensor.aussentemperatur        Außentemperatur / outdoor
#   Benachrichtigung / notification
#     notify.mobile_app_mein_handy
#   Feiertage / holidays (optional, Integration "Arbeitstag"/"Workday")
#     binary_sensor.arbeitstag_heute   (Offset 0)
#     binary_sensor.arbeitstag_morgen  (Offset 1)
#     Fehlen sie, gilt Mo–Fr / if missing, Mon–Fri is used.
#
#  Nach dem Einspielen EINMAL ausführen / run ONCE after installing:
#   - Skript "Heizung Standardwerte setzen"
#   - Skript "Heizung Lernwerte zurücksetzen"
################################################################

