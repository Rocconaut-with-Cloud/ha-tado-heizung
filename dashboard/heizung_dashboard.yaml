type: vertical-stack
cards:
  - type: entities
    title: Heizung – Einstellungen
    entities:
      - input_boolean.heizung_automatik
      - input_boolean.heizung_urlaub
      - input_boolean.heizung_lernen
      - input_boolean.heizung_benachrichtigung
      - type: section
        label: Temperaturen
      - input_number.heizung_temp_wohnkueche
      - input_number.heizung_temp_bad
      - input_number.heizung_temp_schlafzimmer
      - input_number.heizung_temp_zimmer1
      - input_number.heizung_temp_zimmer2
      - input_number.heizung_temp_zimmer3
      - input_number.heizung_temp_abwesend
      - input_number.heizung_temp_nacht
      - input_number.heizung_temp_urlaub
      - type: section
        label: Zeiten (Zielzeiten – wann es warm sein soll)
      - input_datetime.heizung_wt_morgen_start
      - input_datetime.heizung_wt_zimmer_start
      - input_datetime.heizung_we_nacht_ende
      - input_datetime.heizung_wt_nacht_start
      - input_datetime.heizung_we_nacht_start
      - type: section
        label: Fenster & Lernen
      - input_number.heizung_fenster_offen_min
      - input_number.heizung_fenster_zu_min
      - input_number.heizung_fenster_aussen_grenze
      - input_number.heizung_puffer_tado
      - input_number.heizung_toleranz_warm
      - input_number.heizung_toleranz_abfall
      - input_text.heizung_person_zimmer3
  - type: entities
    title: Lernen – Wohnküche
    state_color: true
    entities:
      - entity: sensor.heizung_ist_wohnkueche
        name: Ist-Temperatur
      - entity: sensor.heizung_soll_wohnkueche
        name: Soll laut Automation
      - type: attribute
        entity: climate.thermostat_wohnzimmer
        attribute: temperature
        name: Soll am Thermostat Wohnzimmer
        suffix: °C
      - type: attribute
        entity: climate.thermostat_kueche
        attribute: temperature
        name: Soll am Thermostat Küche
        suffix: °C
      - entity: binary_sensor.heizung_abweichung_wohnkueche
        name: Abweichung
      - entity: binary_sensor.heizung_fenster_wohnkueche
        name: Fenster
      - entity: input_number.heizung_vorlauf_wohnkueche
        name: Vorlauf
      - entity: input_number.heizung_nachlauf_wohnkueche
        name: Nachlauf
      - entity: sensor.heizung_heizstart_wohnkueche
        name: Heizstart heute
        format: time
      - entity: sensor.heizung_absenkstart_wohnkueche
        name: Absenkung heute
        format: time
      - entity: input_text.heizung_ergebnis_morgen_wohnkueche
        name: Morgens
      - entity: input_text.heizung_ergebnis_abend_wohnkueche
        name: Abends
